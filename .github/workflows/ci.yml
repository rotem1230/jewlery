name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, migration drift, regression suites, smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malinvosky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The e2e suites migrate and seed this database, and create scratch databases next to it
      # for the data-migration tests (the service user is a superuser).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/malinvosky_test?schema=public&connection_limit=24
      # Used by `npm run migrations:check` to replay the migrations and diff them with schema.prisma.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/malinvosky_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create the shadow database for the drift check
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE malinvosky_shadow'
      - run: npm run typecheck
      - run: npm run migrations:check
      - name: Unit and e2e regression suites
        run: npm test
      - name: Smoke run of the built API against the demo seed
        run: npm run test:e2e:local

  backend-images:
    name: Backend — container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -t malinvosky-api backend
      - name: Release image (migrations + reference seed)
        run: docker build --target release -t malinvosky-release backend

  app:
    name: Mobile app — typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
