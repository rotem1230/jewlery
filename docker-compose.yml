services:
  postgres:
    image: postgres:16-alpine
    container_name: mailnvosky-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: mailnvosky
      POSTGRES_PASSWORD: mailnvosky
      POSTGRES_DB: mailnvosky
    volumes:
      - mailnvosky_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailnvosky -d mailnvosky']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailnvosky-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - mailnvosky_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mailnvosky_pg_data:
  mailnvosky_redis_data:
